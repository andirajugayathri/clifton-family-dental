<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Options</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ec7223;
            --secondary-color: #EFF8FF;
            --text-color: #527282;
            --accent-color: #3a3a3a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .payment-logos-section {
            padding: 80px 0;
            background-color: #ffffff;
        }

        .payment-logos-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .payment-logos-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }

        .payment-logos-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }

        .payment-logos-subtitle {
            font-size: 1.1rem;
            color: var(--text-color);
            margin-top: 25px;
        }

        .logos-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .logos-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: nowrap;
        }

        .logos-row:last-child {
            margin-bottom: 0;
        }

        /* First row - 6 logos */
        .logos-row-first {
            padding: 0 50px;
        }

        /* Second row - 5 logos (offset for zigzag) */
        .logos-row-second {
            padding: 0 100px;
        }

        .logo-item {
            background-color: #ffffff;
            border: 2px solid var(--secondary-color);
            border-radius: 12px;
            padding: 25px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 160px;
            min-height: 100px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            flex: 0 0 auto;
        }

        .logo-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(236, 114, 35, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .logo-item:hover::before {
            left: 100%;
        }

        .logo-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 8px 25px rgba(236, 114, 35, 0.15);
        }

        .logo-item img {
            max-width: 140px;
            max-height: 60px;
            object-fit: contain;
            filter: grayscale(20%);
            transition: filter 0.3s ease;
        }

        .logo-item:hover img {
            filter: grayscale(0%);
        }

        @media (max-width: 1200px) {
            .logos-row-first,
            .logos-row-second {
                padding: 0 20px;
            }

            .logos-row {
                gap: 25px;
            }
        }

        @media (max-width: 992px) {
            .logos-row-first,
            .logos-row-second {
                padding: 0;
                justify-content: center;
            }

            .logo-item {
                min-width: 140px;
                padding: 20px 25px;
            }
        }

        @media (max-width: 768px) {
            .payment-logos-section {
                padding: 50px 0;
            }

            .payment-logos-title {
                font-size: 2rem;
            }

            .logos-row {
                gap: 20px;
            }

            .logo-item {
                min-width: 130px;
                min-height: 90px;
            }

            .logo-item img {
                max-width: 120px;
                max-height: 50px;
            }
        }

        @media (max-width: 576px) {
            .logos-row {
                gap: 15px;
            }

            .logo-item {
                min-width: 100px;
                padding: 15px 20px;
                min-height: 80px;
            }

            .logo-item img {
                max-width: 90px;
                max-height: 45px;
            }
        }
    </style>
</head>
<body>
    <section class="payment-logos-section">
    <div class="container">
        <div class="payment-logos-header">
            <h2 class="payment-logos-title">Payment Options</h2>
            <p class="payment-logos-subtitle">
                We accept multiple payment methods for your convenience
            </p>
        </div>

        <div class="logos-container">
            <!-- First Row - 6 logos -->
            <div class="logos-row logos-row-first">

                <div class="logo-item">
                    <a href="https://www.hcf.com.au/" target="_blank">
                        <img src="https://cliftonfamilydental.com.au/wp-content/uploads/2022/04/hcf.png" alt="HCF">
                    </a>
                </div>

                <div class="logo-item">
                    <a href="https://www.medibank.com.au/" target="_blank">
                        <img src="https://cliftonfamilydental.com.au/wp-content/uploads/2022/04/medibank.png" alt="Medibank">
                    </a>
                </div>

                <div class="logo-item">
                    <a href="https://www.nib.com.au/" target="_blank">
                        <img src="https://cliftonfamilydental.com.au/wp-content/uploads/2022/04/NIB.jpg" alt="NIB">
                    </a>
                </div>

                <div class="logo-item">
                    <a href="https://www.qantas.com/au/en/frequent-flyer/partners/insurance.html" target="_blank">
                        <img src="https://cliftonfamilydental.com.au/wp-content/uploads/2022/04/quants.png" alt="Qantas Health">
                    </a>
                </div>

                <div class="logo-item">
                    <a href="https://www.aami.com.au/" target="_blank">
                        <img src="https://cliftonfamilydental.com.au/wp-content/uploads/2022/04/aami-1.png" alt="AAMI">
                    </a>
                </div>

                <div class="logo-item">
                    <a href="https://www.servicesaustralia.gov.au/medicare" target="_blank">
                        <img src="https://cliftonfamilydental.com.au/wp-content/uploads/2022/04/medicare-300x75.jpg" alt="Medicare">
                    </a>
                </div>

            </div>

            <!-- Second Row - 5 logos -->
            <div class="logos-row logos-row-second">

                <div class="logo-item">
                    <a href="https://www.guhealth.com.au/" target="_blank">
                        <img src="https://cliftonfamilydental.com.au/wp-content/uploads/2022/04/guhealth.png" alt="GU Health">
                    </a>
                </div>

                <div class="logo-item">
                    <a href="https://www.bupa.com.au/" target="_blank">
                        <img src="https://cliftonfamilydental.com.au/wp-content/uploads/2022/04/R.jpeg" alt="Bupa">
                    </a>
                </div>

                <div class="logo-item">
                    <a href="https://www.allianz.com.au/" target="_blank">
                        <img src="https://cliftonfamilydental.com.au/wp-content/uploads/2022/04/R-300x101.png" alt="Allianz">
                    </a>
                </div>

                <div class="logo-item">
                    <a href="https://www.dva.gov.au/" target="_blank">
                        <img src="https://cliftonfamilydental.com.au/wp-content/uploads/2022/04/DVA_logo.gif" alt="DVA">
                    </a>
                </div>

                <div class="logo-item">
                    <a href="https://www.suncorp.com.au/" target="_blank">
                        <img src="https://cliftonfamilydental.com.au/wp-content/uploads/2022/04/suncorp-logo-179x52-1.png" alt="Suncorp">
                    </a>
                </div>

            </div>
        </div>
    </div>
</section>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
